<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .contenedor{
            /*Dirección ya sea horizontal o vertical*/
            /* display: flex;
            flex-direction: column; */
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }
        .card{
            width: 80px;
            padding: 20px;
            margin: 20px;
        }
        .card-larga{
            grid-column: 3;
            grid-row: span 3;
            display: flex;
            flex-direction: column;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <div class="card" style = "background-color: lightblue;">CARD 1</div>
        <div class="card" style = "background-color: lightgreen;">CARD 2</div>
        <div class="card-larga" style = "background-color: lightcoral;">CARD 3</div>
        <div class="card" style = "background-color: lightyellow;">CARD 4</div>
        <div class="card" style = "background-color: rgb(255, 224, 250);">CARD 5</div>
        <div class="card" style = "background-color: rgb(255, 224, 224);">CARD 6</div>
        <div class="card" style = "background-color: rgb(235, 255, 224);">CARD 7</div>
    </div>
    
</body>
</html>
